<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Dotabaff</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <!-- СЮДА ВСТАВИТЬ ШАПКУ ИЗ index.html -->
         <header class="topbar">
        <div class="logo">
            <img src="logo.png" alt="DotaBuff" class="logo-img">
            <span class="logo-text">DotaBuff</span>
        </div>
        <nav class="main-nav">
            <a href="#heroes" class="nav-link active">Герои</a>
            <a href="meta.html" class="nav-link">Мета</a>
            <a href="matchups.html" class="nav-link">Матчапы</a>
            <a href="#stats" class="nav-link">Статистика</a>
        </nav>
<input type="checkbox" id="loginToggle" class="login-toggle">

<label for="loginToggle" class="login-btn">Войти</label>

<div class="login-modal">
    <label for="loginToggle" class="login-overlay"></label>
    <div class="login-box">
        <label for="loginToggle" class="login-close"></label>
        <h3 class="login-title">Вход</h3>
        <form class="login-form">
            <input type="text" class="login-input" placeholder="Логин" required>
            <input type="password" class="login-input" placeholder="Пароль" required>
            <button type="submit" class="login-submit">Войти</button>
        </form>
    </div>
</div>
<button class="burger" id="burgerBtn" aria-label="Открыть меню">
    <span></span>
    <span></span>
    <span></span>
</button>
    </header>
    
    <!-- СЮДА ФОРМУ РЕГИСТРАЦИИ (добавим в ШАГЕ 3) -->
    <main class="register-main">
    <form class="register-form" id="registerForm" novalidate>
        <h1>Регистрация</h1>

        <div class="form-group">
            <label for="username">Имя пользователя</label>
            <input type="text" id="username" placeholder="ivan_petrov" autocomplete="username">
            <small class="error" id="usernameError"></small>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="ivan@example.com" autocomplete="email">
            <small class="error" id="emailError"></small>
        </div>

                <div class="form-group">
            <label for="password">Пароль</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Минимум 8 символов" autocomplete="new-password">
                <button type="button" class="toggle-password" id="togglePassword">👁️</button>
            </div>
            
            <small class="error" id="passwordError"></small>
            <div class="strength-bar">
                <div class="strength-fill" id="strengthFill"></div>
            </div>
            <p class="strength-text" id="strengthText">Введите пароль</p>
        </div>
        <div class="form-group">
            <label for="confirm">Подтверждение пароля</label>
            <input type="password" id="confirm" placeholder="Повторите пароль" autocomplete="new-password">
            <small class="error" id="confirmError"></small>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn" disabled>
            Зарегистрироваться
        </button>

        <p class="form-footer">
            Уже есть аккаунт? <a href="#">Войти</a>
        </p>
        <div class="form-group checkbox-group">
    <label class="checkbox-label">
        <input type="checkbox" id="terms">
        <span>Я согласен с <a href="terms.html">условиями обработки</a></span>
    </label>
    <small class="error" id="termsError"></small>
</div>

    </form>
</main>

    <!-- СЮДА ВСТАВИТЬ ПОДВАЛ ИЗ index.html -->
     <footer class="footer">
    <div class="footer-content">
        <p class="footer-copy">© 2026 DotaBuff</p>
        <nav class="footer-links">
            <a href="mailto:matupaevislam@gmail.com">matupaevislam@gmail.com</a>
            <a href="https://github.com/Gulldann14" target="_blank">GitHub: Gulldann14</a>
            <a href="terms.html">Пользовательское соглашение</a>
        </nav>
    </div>
    
</footer>
    
    <script src="register.js"></script>
</body>
</html>
